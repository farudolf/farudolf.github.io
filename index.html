<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fabian Rudolf</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f9f9fb;
      --text: #1a1a1a;
      --accent: #007acc;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      padding: 2rem;
      text-align: center;
    }

    header h1 {
      margin-bottom: 0.5rem;
      font-size: 2.2rem;
    }

    header p {
      margin-top: 0;
      font-size: 1.1rem;
      color: #555;
    }

    main {
      max-width: 700px;
      margin: 0 auto;
      padding: 0 1.5rem 2rem;
    }

    section {
      margin-bottom: 2rem;
    }

    h2 {
      color: var(--accent);
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    ul {
      list-style-type: none;
      padding-left: 0;
    }

    li {
      margin-bottom: 0.8rem;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.9rem;
      color: #999;
    }
  </style>
</head>
<body>

  <header>
    <h1>Fabian Rudolf</h1>
    <p>M.Sc. Applied Physics | Data Scientist</p>
  </header>

  <main>
    <section>
      <h2>About</h2>
      <p>
        I’m currently working on this page.
      </p>
    </section>

    <section>
      <h2>Projects</h2>
      <ul>
        <li><a href="farudolf.github.io/">Website</a></li>
      </ul>
    </section>

    <section>
      <h2>Contact</h2>
      <form action="https://formspree.io/f/mblkoyjq" method="POST">
        <label for="name">Name:</label><br />
        <input type="text" id="name" name="name" required><br /><br />
    
        <label for="email">Email:</label><br />
        <input type="email" id="email" name="email" required><br /><br />
    
        <label for="message">Message:</label><br />
        <textarea id="message" name="message" rows="5" required></textarea><br /><br />
    
        <button type="submit">Send</button>
      </form>
      <ul>
        <li><a href="https://github.com/farudolf" target="_blank">GitHub</a></li>
        <li><a href="https://www.linkedin.com/in/fabianrudolf/" target="_blank">LinkedIn</a></li>
      </ul>
  </section>

  </main>

  <footer>
    &copy; 2025 Fabian Rudolf. Hosted on <a href="https://pages.github.com" target="_blank">GitHub Pages</a>.
  </footer>

  <script>
  const user = "mail"; // Replace with your email name
  const domain = "fabianrudolf.com"; // Replace with your domain
  const emailLink = document.createElement("a");
  emailLink.href = `mailto:${user}@${domain}`;
  emailLink.textContent = `${user}@${domain}`;
  document.getElementById("email").appendChild(emailLink);
  </script>

</body>
</html>
